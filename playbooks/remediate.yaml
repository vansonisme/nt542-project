---
- name: CIS Benchmarks Remediation
  hosts: >-
    {{
      (plan | dict2items | map(attribute='key') | join(','))
      if plan is defined
      else (target | default('all'))
    }}
  become: true
  gather_facts: false

  vars:
    project_root: "{{ playbook_dir }}/.."
    remediate_dir: "{{ project_root }}/scripts/remediate"

    all_cis: >-
      {{
        query('fileglob', remediate_dir ~ '/remediate_*.sh')
        | map('basename')
        | map('regex_replace', '^remediate_(.*)\.sh$', '\1')
        | list
        | community.general.version_sort
      }}

    requested_cis: >-
      {{
        (plan[inventory_hostname] | default([]) | map('string') | list)
        if plan is defined
        else ((cis | default('all') | string).split(',') | map('trim') | list)
      }}

    cis_ids: >-
      {{
        all_cis
        if ('all' in requested_cis)
        else requested_cis
      }}

  pre_tasks:
    - name: Lưu danh sách host của lượt chạy
      ansible.builtin.set_fact:
        run_hosts: "{{ ansible_play_hosts_all }}"
      run_once: true
      delegate_to: localhost
      delegate_facts: true

    - name: Kiểm tra danh sách CIS Remediation
      ansible.builtin.assert:
        that:
          - all_cis | length > 0
          - cis_ids | length > 0
          - cis_ids | difference(all_cis) | length == 0
        fail_msg: >-
          Host {{ inventory_hostname }}: không tìm thấy script remediation hoặc CIS không hợp lệ:
          {{ cis_ids | difference(all_cis) }}.
          Hiện có: {{ all_cis }}
        quiet: true

  tasks:
    - name: Chạy các script CIS Remediation
      ansible.builtin.script: "{{ remediate_dir }}/remediate_{{ item }}.sh"
      args:
        executable: /bin/bash
      loop: "{{ cis_ids }}"
      loop_control:
        label: "CIS {{ item }}"
      register: remediate_results
      changed_when: "'[REMEDIATED]' in (remediate_results.stdout | default(''))"
      failed_when: false

    - name: Tạo nội dung báo cáo Remediation
      ansible.builtin.set_fact:
        report_text: |
          ========== REMEDIATION REPORT - SERVER: {{ inventory_hostname }} ==========
          {% for res in remediate_results.results %}
          {{ '─' * 40 }}
          CIS Remediate: {{ res.item }}
          {% for line in res.stdout_lines | default([]) %}
            {{ line }}
          {% endfor %}
          {% endfor %}
          {{ '─' * 40 }}
          TỔNG KẾT: {{ pass_count }} PASS | {{ remediated_count }} REMEDIATED | {{ fail_count }} FAIL
      vars:
        all_lines: "{{ remediate_results.results | map(attribute='stdout_lines', default=[]) | flatten }}"
        pass_count: "{{ all_lines | select('match', '^\\[PASS\\]') | list | length }}"
        remediated_count: "{{ all_lines | select('match', '^\\[REMEDIATED\\]') | list | length }}"
        fail_count: "{{ all_lines | select('match', '^\\[FAIL\\]') | list | length }}"

    - name: In báo cáo Remediation
      ansible.builtin.debug:
        msg: "{{ report_text.rstrip().split('\n') }}"

    - name: Tạo CSV rows
      ansible.builtin.set_fact:
        csv_rows: |
          {% for res in remediate_results.results %}
          {% for line in res.stdout_lines | default([]) if line.startswith(('[PASS]', '[REMEDIATED]', '[FAIL]')) %}
          {{ inventory_hostname }},{{ res.item }},{{ line.split(']')[0] | replace('[', '') }},"{{ (line.split('] ', 1) | last) | replace('"', '""') }}"
          {% endfor %}
          {% endfor %}


- name: Generate Remediation Reports
  hosts: localhost
  gather_facts: false

  vars:
    report_dir: "{{ playbook_dir | dirname }}/reports"
    run_hosts: "{{ hostvars['localhost']['run_hosts'] | default([]) }}"

  tasks:
    - name: Tạo thư mục reports
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: '0755'

    - name: Lưu báo cáo riêng từng server
      ansible.builtin.copy:
        dest: "{{ report_dir }}/remediate_{{ item }}.txt"
        content: "{{ hostvars[item].report_text }}"
      loop: "{{ run_hosts }}"
      loop_control:
        label: "{{ item }}"
      when: hostvars[item].report_text is defined

    - name: Xuất CSV tổng hợp Remediation
      ansible.builtin.copy:
        dest: "{{ report_dir }}/remediate_report.csv"
        content: |
          server,check,status,message
          {% for h in run_hosts if hostvars[h].csv_rows is defined and hostvars[h].csv_rows | trim | length > 0 %}
          {{ hostvars[h].csv_rows | trim }}
          {% endfor %}
